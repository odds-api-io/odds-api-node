name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Check release tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version $VERSION does not match release tag $TAG"; exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
